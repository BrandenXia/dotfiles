lines 20
background_opacity 0.7

# Move the quick access terminal without affecting its size or running programs.
# These shortcuts apply only to the quick access terminal.
kitty_override map=alt+shift+k remote_control resize-os-window --action=os-panel --incremental edge=top
kitty_override map=alt+shift+j remote_control resize-os-window --action=os-panel --incremental edge=bottom
